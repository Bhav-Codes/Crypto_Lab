# SonarQube Configuration for Library Management System
# Group 4 - Lab Assignment 3

# Project identification
sonar.projectKey=library-management-system-group4
sonar.projectName=Library Management System - Group 4
sonar.projectVersion=1.0
sonar.organization=cryptolab

# Source code location
sonar.sources=src
