# Exclusions (optional)
sonar.exclusions=**/*.md,**/.gitkeep,**/library.db

# Test coverage (optional - if you add tests later)
# sonar.tests=testcases
# sonar.python.coverage.reportPaths=coverage.xml

# Analysis parameters
sonar.verbose=false
